<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen · Administración Coffee Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23241610'/%3E%3Cg transform='translate(4,3) scale(0.82)' fill='none' stroke='%23D9A45B' stroke-linecap='round'%3E%3Cpath fill='%23D9A45B' fill-rule='evenodd' d='M6.5 14.5h29v9.2A14.5 14.5 0 0 1 21 38.2 14.5 14.5 0 0 1 6.5 23.7Z M17.4 19.4v13.1l3.3-3.3 2.3 5.1 2.9-1.3-2.3-5 4.7-.3Z'/%3E%3Cpath stroke-width='3' d='M36 18.6h2.3a5.4 5.4 0 0 1 0 10.8H36'/%3E%3Cpath stroke-width='3.4' d='M5.6 42.4h30.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>
<script src="index.js"></script>

<div class="panel-admin">
  <div id="lateral"></div>

  <div class="panel-admin__principal">
    <div id="superior"></div>

    <div class="panel-admin__contenido">
      <div class="grid-4 mb-6" id="indicadores"></div>

      <div class="dividido dividido--admin mb-6">

        <section class="panel">
          <div class="fila fila--entre mb-4">
            <h3 class="panel__titulo">Ventas de los últimos 7 días</h3>
            <span class="etiqueta etiqueta--ambar" id="total-semana"></span>
          </div>
          <div class="grafico" id="grafico"></div>
        </section>

        <section class="panel">
          <h3 class="panel__titulo mb-5">Lo más vendido</h3>
          <div class="ranking-barras" id="ranking"></div>
        </section>

      </div>

      <section class="panel panel--ajustado">
        <div class="panel__cabecera">
          <h3 class="panel__titulo">Pedidos en curso</h3>
          <a class="boton boton--fantasma boton--sm" href="../pedidos/pedidos.html">
            Ver todos
            <svg class="icono icono--sm"><use href="#i-chev-right"></use></svg>
          </a>
        </div>
        <div class="tabla__desplazable">
          <table class="tabla">
            <thead>
              <tr>
                <th>Código</th><th>Cliente</th><th>Productos</th>
                <th>Entrega</th><th>Hora</th><th>Estado</th><th class="tabla__numero">Total</th>
              </tr>
            </thead>
            <tbody id="tabla-curso"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
  CO.iniciar({ cabecera: false, pie: false });

  if (CO.exigirAdmin()) {
    ADMIN.montar('resumen', 'Resumen de hoy');

    var hoy   = ADMIN.deHoy();
    var ayer  = ADMIN.deAyer();
    var todos = CO.pedidos();

    var ventasHoy  = ADMIN.ventas(hoy);
    var ventasAyer = ADMIN.ventas(ayer);
    var ticket     = hoy.length ? ventasHoy / hoy.length : 0;
    var enCocina   = todos.filter(function (p) { return p.estado === 'recibido' || p.estado === 'preparando'; }).length;

    function tarjeta(etiqueta, valor, ico, pie) {
      return '<div class="estadistica">' +
        '<p class="estadistica__etiqueta">' + CO.icono(ico, 'icono--sm') + etiqueta + '</p>' +
        '<p class="estadistica__valor">' + valor + '</p>' + pie +
      '</div>';
    }

    /* --- Indicadores --- */
    CO.qs('#indicadores').innerHTML =
      tarjeta('Ventas de hoy', CO.money(ventasHoy), 'i-coins', ADMIN.pintarVariacion(ADMIN.variacion(ventasHoy, ventasAyer))) +
      tarjeta('Pedidos de hoy', hoy.length, 'i-clipboard', ADMIN.pintarVariacion(ADMIN.variacion(hoy.length, ayer.length))) +
      tarjeta('Ticket promedio', CO.money(ticket), 'i-receipt', '<p class="estadistica__cambio atenuado">Sobre ' + hoy.length + ' pedidos</p>') +
      tarjeta('En cocina ahora', enCocina, 'i-utensils',
        enCocina ? '<p class="estadistica__cambio estadistica__cambio--sube">Requieren atención</p>' : '<p class="estadistica__cambio atenuado">Todo al día</p>');

    /* --- Gráfico de barras --- */
    var serie = ADMIN.serieDiaria(7);
    var maximo = Math.max.apply(null, serie.map(function (d) { return d.total; })) || 1;

    CO.qs('#grafico').innerHTML = serie.map(function (d) {
      var alto = Math.max(4, Math.round((d.total / maximo) * 100));
      return '<div class="grafico__columna" title="' + CO.money(d.total) + ' · ' + d.pedidos + ' pedidos">' +
        '<span class="diminuto numero atenuado">' + Math.round(d.total) + '</span>' +
        '<div class="grafico__barra" style="height:' + alto + '%"></div>' +
        '<span class="grafico__etiqueta">' + d.etiqueta + '</span>' +
      '</div>';
    }).join('');

    CO.qs('#total-semana').textContent = CO.money(serie.reduce(function (s, d) { return s + d.total; }, 0)) + ' en la semana';

    /* --- Ranking --- */
    var masVendidos = ADMIN.ranking(6);
    var techo = masVendidos.length ? masVendidos[0].unidades : 1;
    CO.qs('#ranking').innerHTML = masVendidos.map(function (r) {
      return '<div class="ranking-barras__fila">' +
        '<div class="ranking-barras__encabezado"><b>' + CO.escapar(r.nombre) + '</b><span class="atenuado numero">' + r.unidades + ' u.</span></div>' +
        '<div class="ranking-barras__pista"><div class="ranking-barras__relleno" style="width:' + Math.round((r.unidades / techo) * 100) + '%"></div></div>' +
      '</div>';
    }).join('');

    /* --- Pedidos en curso --- */
    var enCurso = todos.filter(function (p) { return p.estado !== 'entregado' && p.estado !== 'anulado'; }).slice(0, 8);

    CO.qs('#tabla-curso').innerHTML = enCurso.length
      ? enCurso.map(function (p) {
          return '<tr>' +
            '<td><b style="color:var(--ink)">' + p.codigo + '</b></td>' +
            '<td>' + CO.escapar(p.cliente) + '</td>' +
            '<td class="pequeno atenuado">' + p.lineas.length + ' ítems · ' +
              CO.escapar(p.lineas[0].nombre) + (p.lineas.length > 1 ? ' +' + (p.lineas.length - 1) : '') + '</td>' +
            '<td class="pequeno">' + CO.escapar(p.entregaNombre) + '</td>' +
            '<td class="numero">' + p.horaRecojo + '</td>' +
            '<td>' + CO.etiquetaEstado(p.estado) + '</td>' +
            '<td class="tabla__numero numero">' + CO.money(p.total) + '</td>' +
          '</tr>';
        }).join('')
      : '<tr><td colspan="7" class="centro atenuado" style="padding:40px">No hay pedidos pendientes. La cocina está al día.</td></tr>';
  }
</script>
</body>
</html>
