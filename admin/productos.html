<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos · Administración Coffee Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23241610'/%3E%3Cg transform='translate(4,3) scale(0.82)' fill='none' stroke='%23D9A45B' stroke-linecap='round'%3E%3Cpath fill='%23D9A45B' fill-rule='evenodd' d='M6.5 14.5h29v9.2A14.5 14.5 0 0 1 21 38.2 14.5 14.5 0 0 1 6.5 23.7Z M17.4 19.4v13.1l3.3-3.3 2.3 5.1 2.9-1.3-2.3-5 4.7-.3Z'/%3E%3Cpath stroke-width='3' d='M36 18.6h2.3a5.4 5.4 0 0 1 0 10.8H36'/%3E%3Cpath stroke-width='3.4' d='M5.6 42.4h30.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="productos.css">
</head>
<body>
<script src="productos.js"></script>

<div class="panel-admin">
  <div id="lateral"></div>

  <div class="panel-admin__principal">
    <div id="superior"></div>

    <div class="panel-admin__contenido">

      <div class="grid-4 mb-6" id="indicadores"></div>

      <div class="barra-herramientas">
        <div class="buscador" style="flex:1;min-width:240px">
          <span class="buscador__icono"><svg class="icono icono--sm"><use href="#i-search"></use></svg></span>
          <input class="input" type="search" id="buscador" placeholder="Buscar producto…" autocomplete="off">
        </div>
        <select class="select" id="filtro-cat" style="width:auto;min-width:180px"></select>
        <button class="boton boton--primario" id="btn-nuevo">
          <svg class="icono icono--sm"><use href="#i-plus"></use></svg>
          Nuevo producto
        </button>
      </div>

      <p class="pequeno atenuado mb-4" id="conteo"></p>

      <section class="panel panel--ajustado">
        <div class="tabla__desplazable">
          <table class="tabla">
            <thead>
              <tr>
                <th>Producto</th><th>Código</th><th>Categoría</th>
                <th class="tabla__numero">Precio</th><th class="tabla__numero">Stock</th>
                <th>Estado</th><th></th>
              </tr>
            </thead>
            <tbody id="tabla"></tbody>
          </table>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- Alta / edición -->
<div class="modal" id="modal">
  <div class="modal__fondo" data-cerrar></div>
  <div class="modal__caja">
    <div class="modal__cabecera">
      <h3 class="panel__titulo" id="m-titulo">Nuevo producto</h3>
      <button class="boton-icono" data-cerrar aria-label="Cerrar">
        <svg class="icono"><use href="#i-close"></use></svg>
      </button>
    </div>

    <form id="form-producto" novalidate>
      <div class="modal__cuerpo">
        <div class="alerta alerta--error" id="error-form" hidden>
          <svg class="icono icono--sm"><use href="#i-alert"></use></svg>
          <span id="error-form-texto"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="f-nombre">Nombre</label>
          <input class="input" id="f-nombre" type="text" placeholder="Ej. Sánguche de pollo">
        </div>

        <div class="grid-2" style="gap:16px">
          <div class="campo">
            <label class="campo__etiqueta" for="f-cat">Categoría</label>
            <select class="select" id="f-cat"></select>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="f-precio">Precio (S/)</label>
            <input class="input" id="f-precio" type="number" step="0.50" min="0.5" placeholder="9.50">
          </div>
        </div>

        <div class="grid-2" style="gap:16px">
          <div class="campo">
            <label class="campo__etiqueta" for="f-stock">Stock del día</label>
            <input class="input" id="f-stock" type="number" min="0" step="1" placeholder="30">
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="f-img">Imagen <span class="atenuado">(opcional)</span></label>
            <select class="select" id="f-img"></select>
          </div>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="f-desc">Descripción</label>
          <textarea class="textarea" id="f-desc" placeholder="Cómo se prepara, qué trae, en qué se sirve…"></textarea>
        </div>

        <div class="fila gap-4 fila--ajustar">
          <label class="fila gap-2 pequeno" style="cursor:pointer">
            <input type="checkbox" id="f-activo" checked style="accent-color:var(--amber-ink)"> Disponible en carta
          </label>
          <label class="fila gap-2 pequeno" style="cursor:pointer">
            <input type="checkbox" id="f-destacado" style="accent-color:var(--amber-ink)"> Marcar como favorito
          </label>
          <label class="fila gap-2 pequeno" style="cursor:pointer">
            <input type="checkbox" id="f-nuevo" style="accent-color:var(--amber-ink)"> Marcar como novedad
          </label>
        </div>
      </div>

      <div class="modal__pie">
        <button class="boton boton--discreto" type="button" data-cerrar>Cancelar</button>
        <button class="boton boton--primario" type="submit">Guardar producto</button>
      </div>
    </form>
  </div>
</div>

<script>
  CO.iniciar({ cabecera: false, pie: false });

  if (CO.exigirAdmin()) {
    ADMIN.montar('productos', 'Catálogo de productos');

    var editando = null;
    var busqueda = '';
    var catFiltro = '';

    /* Imágenes que ya están en la carpeta del proyecto */
    var IMAGENES = [
      'agua-san-luis.jpg', 'aji-de-gallina.jpg', 'arroz-chaufa.jpg', 'arroz-con-pollo.jpg',
      'cabrito-norteno.jpg', 'cafe-pasado.jpg', 'capuchino.jpg', 'causa-limena.jpg',
      'chicha-morada.jpg', 'coca-cola.jpg', 'desayuno-universitario.jpg', 'ensalada-de-frutas.jpg',
      'fanta.jpg', 'frito-norteno.jpg', 'inka-kola.jpg', 'jugo-de-naranja.jpg', 'lomo-saltado.jpg',
      'manias.jpg', 'menu-del-dia.png', 'pan-con-chicharron.jpg', 'pollo-mechado.jpg',
      'tallarines-rojos.jpg', 'trio-marino.jpg'
    ];

    var categoriasReales = CATEGORIAS.filter(function (c) { return c.id !== 'todos'; });

    CO.qs('#filtro-cat').innerHTML = '<option value="">Todas las categorías</option>' +
      categoriasReales.map(function (c) { return '<option value="' + c.id + '">' + c.nombre + '</option>'; }).join('');

    CO.qs('#f-cat').innerHTML =
      categoriasReales.map(function (c) { return '<option value="' + c.id + '">' + c.nombre + '</option>'; }).join('');

    CO.qs('#f-img').innerHTML = '<option value="">Sin foto (usa el mosaico de la categoría)</option>' +
      IMAGENES.map(function (n) { return '<option value="Imagenes/' + n + '">' + n + '</option>'; }).join('');

    /* --- Indicadores --- */
    function indicadores() {
      var lista = CO.productos();
      var activos = lista.filter(function (p) { return p.activo; }).length;
      var bajos   = lista.filter(function (p) { return p.activo && p.stock <= 12; }).length;
      var valor   = lista.reduce(function (s, p) { return s + p.precio * p.stock; }, 0);

      CO.qs('#indicadores').innerHTML =
        card('Productos en catálogo', lista.length, 'i-package') +
        card('Disponibles hoy', activos, 'i-check-circle') +
        card('Stock bajo', bajos, 'i-alert') +
        card('Valor del inventario', CO.money(valor), 'i-coins');

      function card(etiqueta, valor, ico) {
        return '<div class="estadistica">' +
          '<p class="estadistica__etiqueta">' + CO.icono(ico, 'icono--sm') + etiqueta + '</p>' +
          '<p class="estadistica__valor">' + valor + '</p></div>';
      }
    }

    /* --- Tabla --- */
    function pintar() {
      indicadores();
      var q = CO.normalizar(busqueda.trim());
      var lista = CO.productos().filter(function (p) {
        if (catFiltro && p.cat !== catFiltro) return false;
        if (q && CO.normalizar(p.nombre + ' ' + p.id).indexOf(q) === -1) return false;
        return true;
      });

      CO.qs('#conteo').textContent = lista.length + (lista.length === 1 ? ' producto' : ' productos');

      CO.qs('#tabla').innerHTML = lista.length
        ? lista.map(function (p) {
            var estadoStock = !p.activo
              ? '<span class="etiqueta etiqueta--arcilla">No disponible</span>'
              : p.stock <= 12
                ? '<span class="etiqueta etiqueta--ambar">Stock bajo</span>'
                : '<span class="etiqueta etiqueta--salvia">En carta</span>';

            return '<tr>' +
              '<td><div class="celda-producto">' + CO.miniatura(p) +
                '<span><b>' + CO.escapar(p.nombre) + '</b>' +
                '<span class="diminuto atenuado">' + CO.escapar(p.desc.slice(0, 52)) + '…</span></span></div></td>' +
              '<td class="pequeno atenuado numero">' + p.id + '</td>' +
              '<td class="pequeno">' + CO.categoria(p.cat).nombre + '</td>' +
              '<td class="tabla__numero numero">' + CO.money(p.precio) + '</td>' +
              '<td class="tabla__numero numero">' + p.stock + '</td>' +
              '<td>' + estadoStock + '</td>' +
              '<td class="derecha"><div class="fila gap-2" style="justify-content:flex-end">' +
                '<button class="boton-icono boton-icono--sm" data-editar="' + p.id + '" aria-label="Editar">' + CO.icono('i-pencil', 'icono--sm') + '</button>' +
                '<button class="boton-icono boton-icono--sm" data-borrar="' + p.id + '" aria-label="Eliminar" style="color:var(--clay)">' + CO.icono('i-trash', 'icono--sm') + '</button>' +
              '</div></td>' +
            '</tr>';
          }).join('')
        : '<tr><td colspan="7" class="centro atenuado" style="padding:48px">Ningún producto coincide con la búsqueda.</td></tr>';
    }

    /* --- Modal --- */
    function abrir(id) {
      editando = id || null;
      CO.qs('#error-form').hidden = true;
      CO.qs('#m-titulo').textContent = id ? 'Editar producto' : 'Nuevo producto';

      var p = id ? CO.producto(id) : null;
      CO.qs('#f-nombre').value    = p ? p.nombre : '';
      CO.qs('#f-cat').value       = p ? p.cat : 'almuerzos';
      CO.qs('#f-precio').value    = p ? p.precio : '';
      CO.qs('#f-stock').value     = p ? p.stock : 20;
      CO.qs('#f-img').value       = p && p.img ? p.img : '';
      CO.qs('#f-desc').value      = p ? p.desc : '';
      CO.qs('#f-activo').checked  = p ? !!p.activo : true;
      CO.qs('#f-destacado').checked = p ? !!p.destacado : false;
      CO.qs('#f-nuevo').checked   = p ? !!p.nuevo : false;

      CO.qs('#modal').classList.add('is-open');
      CO.qs('#f-nombre').focus();
    }
    function cerrar() { CO.qs('#modal').classList.remove('is-open'); }

    /* Genera un código correlativo por categoría: ALM-14, BEB-09, … */
    function nuevoCodigo(cat) {
      var prefijo = cat.slice(0, 3).toUpperCase();
      var usados = CO.productos()
        .filter(function (p) { return p.id.indexOf(prefijo) === 0; })
        .map(function (p) { return parseInt(p.id.split('-')[1], 10) || 0; });
      var siguiente = (usados.length ? Math.max.apply(null, usados) : 0) + 1;
      return prefijo + '-' + String(siguiente).padStart(2, '0');
    }

    CO.qs('#form-producto').addEventListener('submit', function (e) {
      e.preventDefault();
      CO.qs('#error-form').hidden = true;

      var nombre = CO.qs('#f-nombre').value.trim();
      var precio = parseFloat(CO.qs('#f-precio').value);
      var stock  = parseInt(CO.qs('#f-stock').value, 10);
      var desc   = CO.qs('#f-desc').value.trim();

      var error = '';
      if (nombre.length < 3)          error = 'El nombre debe tener al menos 3 caracteres.';
      else if (!(precio > 0))         error = 'Ingresa un precio mayor a cero.';
      else if (!(stock >= 0))         error = 'El stock no puede quedar vacío.';
      else if (desc.length < 10)      error = 'Describe el producto en al menos 10 caracteres.';

      if (error) {
        CO.qs('#error-form-texto').textContent = error;
        CO.qs('#error-form').hidden = false;
        return;
      }

      var lista = CO.productos();
      var cat = CO.qs('#f-cat').value;

      var datos = {
        nombre: nombre, cat: cat, precio: precio, stock: stock,
        img: CO.qs('#f-img').value || null,
        desc: desc,
        activo: CO.qs('#f-activo').checked,
        destacado: CO.qs('#f-destacado').checked,
        nuevo: CO.qs('#f-nuevo').checked
      };

      if (editando) {
        // [API] PUT /api/productos/{id}
        var i = lista.findIndex(function (p) { return p.id === editando; });
        lista[i] = Object.assign({}, lista[i], datos);
        CO.toast('Producto actualizado');
      } else {
        // [API] POST /api/productos
        datos.id = nuevoCodigo(cat);
        lista.push(datos);
        CO.toast('Producto agregado a la carta');
      }

      CO.guardarProductos(lista);
      cerrar();
      pintar();
    });

    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-cerrar]')) { cerrar(); return; }

      var editar = e.target.closest('[data-editar]');
      if (editar) { abrir(editar.getAttribute('data-editar')); return; }

      var borrar = e.target.closest('[data-borrar]');
      if (borrar) {
        var id = borrar.getAttribute('data-borrar');
        var p = CO.producto(id);
        if (confirm('¿Quitar «' + p.nombre + '» del catálogo?')) {
          // [API] DELETE /api/productos/{id}
          CO.guardarProductos(CO.productos().filter(function (x) { return x.id !== id; }));
          CO.toast('Producto eliminado', 'i-trash');
          pintar();
        }
      }
    });

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });

    CO.qs('#btn-nuevo').addEventListener('click', function () { abrir(null); });
    CO.qs('#buscador').addEventListener('input', function () { busqueda = this.value; pintar(); });
    CO.qs('#filtro-cat').addEventListener('change', function () { catFiltro = this.value; pintar(); });

    pintar();
  }
</script>
</body>
</html>
