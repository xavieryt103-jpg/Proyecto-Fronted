<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido confirmado · Coffee Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23241610'/%3E%3Cg transform='translate(4,3) scale(0.82)' fill='none' stroke='%23D9A45B' stroke-linecap='round'%3E%3Cpath fill='%23D9A45B' fill-rule='evenodd' d='M6.5 14.5h29v9.2A14.5 14.5 0 0 1 21 38.2 14.5 14.5 0 0 1 6.5 23.7Z M17.4 19.4v13.1l3.3-3.3 2.3 5.1 2.9-1.3-2.3-5 4.7-.3Z'/%3E%3Cpath stroke-width='3' d='M36 18.6h2.3a5.4 5.4 0 0 1 0 10.8H36'/%3E%3Cpath stroke-width='3.4' d='M5.6 42.4h30.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="confirmacion.css">
</head>
<body>
<script src="confirmacion.js"></script>

<div id="cabecera"></div>

<main class="contenedor" style="padding-block:var(--s7) var(--s8);max-width:900px">
  <div id="contenido"></div>
</main>

<div id="pie"></div>

<script>
  CO.iniciar({ activo: 'pedidos' });

  var pedido = CO.pedido(CO.param('codigo'));

  if (!pedido) {
    CO.qs('#contenido').innerHTML =
      '<div class="vacio">' +
        '<div class="vacio__icono">' + CO.icono('i-receipt', 'icono--lg') + '</div>' +
        '<h3>No encontramos ese pedido</h3>' +
        '<p class="atenuado mt-2">Verifica el código o revisa tu historial.</p>' +
        '<a class="boton boton--primario boton--sm mt-4" href="../pedidos/pedidos.html">Ver mis pedidos</a>' +
      '</div>';
  } else {
    var metodo = METODOS_PAGO.filter(function (m) { return m.id === pedido.pago; })[0] || METODOS_PAGO[0];
    var indiceActual = ESTADOS_PEDIDO.map(function (e) { return e.id; }).indexOf(pedido.estado);

    var pasos = ESTADOS_PEDIDO.map(function (e, i) {
      var clase = i < indiceActual ? 'is-done' : i === indiceActual ? 'is-current' : 'is-pending';
      var registro = (pedido.historial || []).filter(function (h) { return h.estado === e.id; })[0];
      return '<div class="hito ' + clase + '">' +
        '<span class="hito__punto">' + CO.icono(i < indiceActual ? 'i-check' : e.icono, 'icono--sm') + '</span>' +
        '<span class="hito__etiqueta">' + e.nombre + '</span>' +
        '<span class="hito__hora">' + (registro ? CO.hora(registro.en) : '—') + '</span>' +
      '</div>';
    }).join('');

    CO.qs('#contenido').innerHTML =

      '<div class="centro mb-6">' +
        '<div class="vacio__icono" style="background:var(--sage-soft);color:var(--sage);width:68px;height:68px">' +
          CO.icono('i-check-circle', 'icono--xl') +
        '</div>' +
        '<p class="antetitulo">Pedido registrado</p>' +
        '<h1 style="font-size:2.25rem">Ya está en cocina</h1>' +
        '<p class="intro mt-3" style="margin-inline:auto">' +
          'Anota tu código: lo pedimos al momento de entregarte. Te avisamos al ' +
          CO.escapar(pedido.telefono || 'celular registrado') + ' cuando esté listo.' +
        '</p>' +
      '</div>' +

      '<div class="panel centro" style="background:var(--ink);border-color:var(--ink);color:#F2E9DD">' +
        '<p class="diminuto" style="letter-spacing:.14em;text-transform:uppercase;color:#D9A45B">Código de pedido</p>' +
        '<p style="font-family:var(--font-display);font-size:2.75rem;font-weight:600;color:#FFF8EE;letter-spacing:.02em">' +
          pedido.codigo +
        '</p>' +
        '<p class="pequeno" style="color:rgba(242,233,221,.65)">' +
          CO.escapar(pedido.entregaNombre) + ' · ' + CO.escapar(pedido.entregaDetalle) + ' · recojo ' + pedido.horaRecojo +
        '</p>' +
      '</div>' +

      '<div class="panel mt-5">' +
        '<h3 class="panel__titulo">Estado del pedido</h3>' +
        '<div class="hitos">' + pasos + '</div>' +
      '</div>' +

      '<div class="grid-2 mt-5" style="gap:24px;align-items:start">' +

        '<div class="panel">' +
          '<h3 class="panel__titulo mb-4">Detalle</h3>' +
          pedido.lineas.map(function (l) {
            return '<div class="fila fila--entre pequeno" style="padding:7px 0;gap:12px">' +
              '<span><b style="color:var(--ink)">' + l.cantidad + '×</b> ' + CO.escapar(l.nombre) + '</span>' +
              '<span class="numero">' + CO.money(l.importe) + '</span>' +
            '</div>';
          }).join('') +
          '<dl class="resumen" style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><dt>Subtotal</dt><dd>' + CO.money(pedido.subtotal) + '</dd></dl>' +
          '<dl class="resumen"><dt>Entrega</dt><dd>' + (pedido.envio ? CO.money(pedido.envio) : 'Gratis') + '</dd></dl>' +
          '<dl class="resumen resumen--total"><dt>Total a pagar</dt><dd>' + CO.money(pedido.total) + '</dd></dl>' +
        '</div>' +

        '<div class="panel">' +
          '<h3 class="panel__titulo mb-4">Datos del recojo</h3>' +
          '<dl class="resumen"><dt>Cliente</dt><dd>' + CO.escapar(pedido.cliente) + '</dd></dl>' +
          '<dl class="resumen"><dt>Celular</dt><dd>' + CO.escapar(pedido.telefono) + '</dd></dl>' +
          '<dl class="resumen"><dt>Punto</dt><dd>' + CO.escapar(pedido.entregaNombre) + '</dd></dl>' +
          '<dl class="resumen"><dt>Hora</dt><dd>' + pedido.horaRecojo + '</dd></dl>' +
          '<dl class="resumen"><dt>Pago</dt><dd>' + metodo.nombre + '</dd></dl>' +
          (pedido.nota
            ? '<div class="caja-ayuda mt-4"><b>Nota para cocina:</b><br>' + CO.escapar(pedido.nota) + '</div>'
            : '') +
          '<div class="fila gap-2 mt-5">' +
            '<a class="boton boton--primario" style="flex:1" href="../pedidos/pedidos.html">Ver mis pedidos</a>' +
            '<button class="boton boton--fantasma" onclick="window.print()" aria-label="Imprimir">' +
              CO.icono('i-printer', 'icono--sm') + '</button>' +
          '</div>' +
          '<a class="boton boton--discreto boton--bloque mt-2" href="../index/index.html#carta">Pedir algo más</a>' +
        '</div>' +

      '</div>';
  }

  MOV.revelar();
  MOV.detalles();
  MOV.anclas();
</script>
</body>
</html>
